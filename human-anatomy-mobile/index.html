<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TVTECH Human Anatomy Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:Arial,sans-serif}#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,#183b63 0,#08111f 45%,#02050a 100%)}#view{position:absolute;left:0;right:0;top:0;height:62vh;min-height:420px}canvas{display:block}.top{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);font-size:11px;letter-spacing:1px;color:#aef6ff;font-weight:bold}.info{position:absolute;z-index:5;left:12px;right:12px;bottom:12px;padding:12px 14px;border-radius:18px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(12px)}.info h1{font-size:22px;margin:0 0 5px}.info p{margin:0;color:rgba(255,255,255,.76);font-size:13px;line-height:1.35}.controls{position:absolute;left:0;right:0;bottom:0;height:38vh;min-height:250px;background:linear-gradient(180deg,rgba(8,16,30,.84),rgba(3,7,14,.98));border-top:1px solid rgba(255,255,255,.12);padding:14px;overflow:auto}.title{color:#89eeff;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;margin:0 0 8px}.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.btn{flex:0 0 auto;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.075);color:#fff;padding:11px 13px;border-radius:14px;font-weight:700;font-size:13px;white-space:nowrap}.btn.active{background:linear-gradient(90deg,rgba(0,205,255,.55),rgba(140,90,255,.48));border-color:#78efff}.panel{margin-top:8px;padding:13px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11)}#name{font-size:20px;font-weight:900;margin-bottom:4px}#sub{color:#8ef2ff;font-weight:800;margin-bottom:7px}#text{color:rgba(255,255,255,.78);line-height:1.45;font-size:13px}.label{position:absolute;z-index:4;transform:translate(-50%,-50%);padding:5px 8px;border-radius:10px;background:rgba(0,0,0,.42);border:1px solid rgba(126,239,255,.35);color:#e6fbff;font-size:11px;pointer-events:none;white-space:nowrap}.hint{position:absolute;z-index:5;left:50%;top:58%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.32);color:rgba(255,255,255,.68);font-size:12px;white-space:nowrap}@media(min-width:900px){#view{height:100vh;left:320px;right:360px}.controls{left:0;top:0;bottom:0;width:320px;height:auto;border-top:0;border-right:1px solid rgba(255,255,255,.12)}.row{display:block;overflow:visible}.btn{display:block;width:100%;margin:7px 0;text-align:left}.info{left:auto;right:14px;top:80px;bottom:auto;width:340px}.hint{top:auto;bottom:20px}}</style></head><body><div id="app"><main id="view"><div class="top"><div class="badge">TVTECH 3D ANATOMY</div><button class="btn" id="reset">Reset</button></div><div class="hint">Kéo để xoay • Chạm vào cơ quan</div></main><section class="info"><h1 id="name">Cơ thể người 3D</h1><p id="textTop">Bản mobile đã sửa: vùng 3D hiển thị rõ trên iPhone, các nút điều khiển nằm phía dưới.</p></section><section class="controls"><div class="title">Chọn lớp giải phẫu</div><div class="row"><button class="btn active" data-stage="0">Tổng quan</button><button class="btn" data-stage="1">Tách da</button><button class="btn" data-stage="2">Cơ & xương</button><button class="btn" data-stage="3">Mạch máu</button><button class="btn" data-stage="4">Nội tạng</button><button class="btn" data-stage="5">Explode</button></div><div class="panel"><div id="sub">Tổng quan giải phẫu</div><div id="text">Quan sát cơ thể, xoay 360° và chuyển từng lớp để xem cấu trúc bên trong.</div></div><div class="row" style="margin-top:10px"><button class="btn" id="rotate">Tự xoay</button><button class="btn" id="labels">Nhãn 3D</button></div></section></div><script type="module">import*as THREE from'https://unpkg.com/three@0.160.0/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';const view=document.getElementById('view'),scene=new THREE.Scene();scene.fog=new THREE.Fog(0x050812,8,22);const cam=new THREE.PerspectiveCamera(42,view.clientWidth/view.clientHeight,.1,100);cam.position.set(0,2.2,7);const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setSize(view.clientWidth,view.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(ren.domElement);const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.target.set(0,1.85,0);ctl.autoRotate=true;ctl.autoRotateSpeed=.6;scene.add(new THREE.HemisphereLight(0xdffaff,0x151b35,2.8));let d=new THREE.DirectionalLight(0xffffff,3);d.position.set(4,7,6);scene.add(d);let r=new THREE.DirectionalLight(0x68eaff,2);r.position.set(-5,4,-4);scene.add(r);let p=new THREE.PointLight(0x805cff,80,10);p.position.set(0,2.8,3);scene.add(p);const grid=new THREE.GridHelper(7,35,0x276f88,0x132538);grid.position.y=-.35;scene.add(grid);const M={skin:new THREE.MeshPhysicalMaterial({color:0xf0b39b,roughness:.42,transparent:true,opacity:.95,transmission:.05}),muscle:new THREE.MeshStandardMaterial({color:0xb3102a,roughness:.45,transparent:true,opacity:.93}),bone:new THREE.MeshStandardMaterial({color:0xeee4cd,roughness:.72,transparent:true,opacity:.96}),blood:new THREE.MeshStandardMaterial({color:0x16d7ff,emissive:0x0078aa,emissiveIntensity:.55,transparent:true,opacity:.95}),nerve:new THREE.MeshStandardMaterial({color:0xffd64d,emissive:0x8a5600,emissiveIntensity:.45,transparent:true,opacity:.9}),heart:new THREE.MeshStandardMaterial({color:0xdc1f3a,emissive:0x500009,emissiveIntensity:.3}),lung:new THREE.MeshPhysicalMaterial({color:0xf49aaa,transparent:true,opacity:.86}),liver:new THREE.MeshStandardMaterial({color:0x7a2536}),stomach:new THREE.MeshStandardMaterial({color:0xf2b468}),brain:new THREE.MeshStandardMaterial({color:0xf6bbc6}),hi:new THREE.MeshStandardMaterial({color:0xffff66,emissive:0xffd000,emissiveIntensity:.8})};const G={skin:new THREE.Group(),muscle:new THREE.Group(),bone:new THREE.Group(),blood:new THREE.Group(),organs:new THREE.Group(),nerves:new THREE.Group()};Object.values(G).forEach(g=>scene.add(g));const click=[],labels=[];function add(n,g,geo,mat,pos,sca=[1,1,1],rot=[0,0,0]){let o=new THREE.Mesh(geo,mat);o.name=n;o.position.set(...pos);o.scale.set(...sca);o.rotation.set(...rot);g.add(o);click.push(o);return o}function cap(n,g,ra,h,mat,pos,sca=[1,1,1],rot=[0,0,0]){return add(n,g,new THREE.CapsuleGeometry(ra,h,12,32),mat,pos,sca,rot)}function sph(n,g,mat,pos,sca=[1,1,1]){return add(n,g,new THREE.SphereGeometry(1,48,32),mat,pos,sca)}sph('Da đầu',G.skin,M.skin,[0,3.55,0],[.48,.55,.45]);cap('Da thân',G.skin,.58,1.75,M.skin,[0,2.2,0],[1.05,1,.68]);for(let s of[-1,1]){cap('Da tay',G.skin,.14,1.65,M.skin,[s*.84,2.22,0],[1,1,.9],[0,0,s*.22]);cap('Da chân',G.skin,.18,1.85,M.skin,[s*.29,.72,0],[1,1,.9])}cap('Cơ thân',G.muscle,.47,1.4,M.muscle,[0,2.2,.03],[1.05,1,.58]);for(let s of[-1,1]){cap('Cơ tay',G.muscle,.105,1.45,M.muscle,[s*.72,2.14,.03],[1,1,.85],[0,0,s*.22]);cap('Cơ chân',G.muscle,.13,1.62,M.muscle,[s*.24,.75,.03],[1,1,.85])}sph('Não',G.organs,M.brain,[0,3.58,.08],[.29,.21,.24]);sph('Tim',G.organs,M.heart,[-.17,2.46,.42],[.17,.2,.16]);sph('Phổi trái',G.organs,M.lung,[-.29,2.43,.35],[.22,.37,.14]);sph('Phổi phải',G.organs,M.lung,[.29,2.43,.35],[.22,.37,.14]);sph('Gan',G.organs,M.liver,[.2,1.87,.36],[.36,.15,.18]);sph('Dạ dày',G.organs,M.stomach,[-.2,1.75,.4],[.17,.25,.15]);sph('Hộp sọ',G.bone,M.bone,[0,3.55,0],[.33,.38,.32]);cap('Cột sống',G.bone,.055,1.75,M.bone,[0,2.15,-.03]);for(let y of[2.65,2.45,2.25,2.05])add('Xương sườn',G.bone,new THREE.TorusGeometry(.42,.018,10,70),M.bone,[0,y,.04],[1,.48,.22],[Math.PI/2,0,0]);for(let s of[-1,1]){cap('Xương tay',G.bone,.04,1.46,M.bone,[s*.68,2.12,-.02],[1,1,1],[0,0,s*.22]);cap('Xương chân',G.bone,.05,1.7,M.bone,[s*.24,.7,-.02])}for(let i=-3;i<=3;i++)cap('Mạch máu',G.blood,.014,1.45,M.blood,[i*.11,2.18,.45]);cap('Động mạch chủ',G.blood,.028,2.1,M.blood,[.1,2.15,.4]);for(let i=-2;i<=2;i++)cap('Dây thần kinh',G.nerves,.01,1.45,M.nerve,[i*.08,2.12,-.22]);function label(n){let obj=click.find(x=>x.name==n);if(!obj)return;let e=document.createElement('div');e.className='label';e.textContent=n;view.appendChild(e);labels.push({e,obj})}['Tim','Phổi trái','Não','Gan','Dạ dày','Cột sống'].forEach(label);const D={Tim:['Tim','Hệ tuần hoàn','Tim bơm máu giàu oxy đi khắp cơ thể.'],'Phổi trái':['Phổi','Hệ hô hấp','Phổi trao đổi khí, đưa oxy vào máu và thải CO₂.'],'Phổi phải':['Phổi','Hệ hô hấp','Phổi trao đổi khí, đưa oxy vào máu và thải CO₂.'],Não:['Não','Hệ thần kinh','Não điều khiển cảm giác, vận động, trí nhớ và tư duy.'],Gan:['Gan','Chuyển hoá','Gan lọc độc tố và hỗ trợ tiêu hoá.'],'Dạ dày':['Dạ dày','Hệ tiêu hoá','Dạ dày chứa và nghiền thức ăn.'],'Cột sống':['Cột sống','Hệ xương khớp','Cột sống nâng đỡ cơ thể và bảo vệ tủy sống.']};function setInfo(a,b,c){document.getElementById('name').textContent=a;document.getElementById('sub').textContent=b;document.getElementById('text').textContent=c;document.getElementById('textTop').textContent=c}let last;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();view.addEventListener('click',e=>{let rr=ren.domElement.getBoundingClientRect();mouse.x=(e.clientX-rr.left)/rr.width*2-1;mouse.y=-(e.clientY-rr.top)/rr.height*2+1;ray.setFromCamera(mouse,cam);let h=ray.intersectObjects(click,false)[0];if(!h)return;if(last&&last.userData.mat)last.material=last.userData.mat;last=h.object;last.userData.mat=last.material;last.material=M.hi;let x=D[last.name]||[last.name,'Cấu trúc 3D','Đây là mô phỏng một bộ phận cơ thể.'];setInfo(...x)});function setG(g,o){g.visible=o>.02;g.traverse(x=>{if(x.material){x.material.transparent=true;x.material.opacity=o}})}function stage(n){let C=[{s:.95,m:0,b:0,v:0,o:0,ne:0,e:0},{s:.18,m:.9,b:.45,v:.25,o:.35,ne:0,e:.65},{s:.05,m:.95,b:1,v:.25,o:.45,ne:.35,e:.35},{s:0,m:.25,b:.55,v:1,o:.82,ne:.55,e:.25},{s:0,m:0,b:.18,v:.35,o:1,ne:.15,e:0},{s:.13,m:.75,b:1,v:1,o:1,ne:.8,e:1.1}][n];setG(G.skin,C.s);setG(G.muscle,C.m);setG(G.bone,C.b);setG(G.blood,C.v);setG(G.organs,C.o);setG(G.nerves,C.ne);G.skin.position.x=-C.e;G.muscle.position.x=C.e*.35;G.bone.position.x=C.e*.12;G.blood.position.z=C.e*.32;G.organs.position.z=C.e*.16;G.nerves.position.x=C.e*.2;let T=[['Cơ thể người 3D','Tổng quan giải phẫu','Quan sát tổng thể cơ thể người, xoay 360° và chuyển lớp để học.'],['Tách lớp da','Da - cơ - xương','Da được làm mờ và tách sang bên để lộ các cấu trúc bên trong.'],['Hệ cơ & xương','Vận động cơ thể','Cơ bám quanh xương, giúp cơ thể vận động và giữ tư thế.'],['Mạch máu','Hệ tuần hoàn','Mạch máu đưa oxy và chất dinh dưỡng đi khắp cơ thể.'],['Nội tạng','Cơ quan quan trọng','Tập trung vào tim, phổi, não, gan và dạ dày.'],['Explode view','Tách lớp trình diễn','Các lớp giải phẫu được tách ra để trình bày trực quan.']][n];setInfo(...T)}stage(0);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-stage]').forEach(x=>x.classList.remove('active'));b.classList.add('active');stage(+b.dataset.stage)});document.getElementById('rotate').onclick=()=>ctl.autoRotate=!ctl.autoRotate;document.getElementById('reset').onclick=()=>{cam.position.set(0,2.2,7);ctl.target.set(0,1.85,0);ctl.update()};let show=true;document.getElementById('labels').onclick=()=>{show=!show;labels.forEach(x=>x.e.style.display=show?'block':'none')};function updLabels(){labels.forEach(({e,obj})=>{let q=obj.getWorldPosition(new THREE.Vector3()).project(cam);e.style.left=(q.x*.5+.5)*view.clientWidth+'px';e.style.top=(-q.y*.5+.5)*view.clientHeight+'px';e.style.opacity=q.z<1?1:0})}function resize(){cam.aspect=view.clientWidth/view.clientHeight;cam.updateProjectionMatrix();ren.setSize(view.clientWidth,view.clientHeight)}addEventListener('resize',resize);function loop(){ctl.update();updLabels();ren.render(scene,cam);requestAnimationFrame(loop)}loop();</script></body></html>
