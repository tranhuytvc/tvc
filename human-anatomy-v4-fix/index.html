(e);labels.push({e:e,o:o})}['Tim','Phổi trái','Não','Gan','Dạ dày','Cột sống'].forEach(label);function setInfo(a,b,c){document.getElementById('name').textContent=a;document.getElementById('sub').textContent=b;document.getElementById('text').textContent=c;document.getElementById('topText').textContent=c}function setGroup(g,o){g.visible=o>.02;g.traverse(function(x){if(x.material){x.material.transparent=true;x.material.opacity=o}})}function stage(n){var C=[{s:.96,m:0,b:0,v:0,ne:0,o:0,e:0},{s:.18,m:.9,b:.45,v:.25,ne:0,o:.35,e:.72},{s:.04,m:.95,b:1,v:.28,ne:.25,o:.45,e:.35},{s:.08,m:.1,b:1,v:1,ne:.9,o:.75,e:.08},{s:0,m:0,b:.18,v:.25,ne:.15,o:1,e:0},{s:.13,m:.75,b:1,v:1,ne:1,o:1,e:1.25}][n];setGroup(G.skin,C.s);setGroup(G.muscle,C.m);setGroup(G.bone,C.b);setGroup(G.blood,C.v);setGroup(G.nerve,C.ne);setGroup(G.organ,C.o);G.skin.position.x=-C.e;G.muscle.position.x=C.e*.36;G.bone.position.x=C.e*.13;G.blood.position.z=C.e*.32;G.nerve.position.x=C.e*.2;G.organ.position.z=C.e*.18;var T=[['V4 Mobile Fix','Tổng quan','Bản đã sửa để model hiện rõ trên mobile.'],['Tách lớp da','Da - cơ - xương','Da được làm trong và tách sang bên để lộ cấu trúc dưới da.'],['Cơ xương','Hệ vận động','Mô phỏng cơ bám quanh khung xương.'],['X-Ray','Xương - mạch - thần kinh','Làm nổi bật xương, mạch máu và thần kinh.'],['Nội tạng','Cơ quan quan trọng','Tập trung vào não, tim, phổi, gan, dạ dày.'],['Explode','Tách lớp trình diễn','Các lớp giải phẫu tách ra để trình diễn trực quan.']][n];setInfo(T[0],T[1],T[2])}stage(0);document.querySelectorAll('[data-stage]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-stage]').forEach(function(x){x.classList.remove('active')});b.classList.add('active');stage(+b.dataset.stage)}});document.getElementById('rotate').onclick=function(){auto=!auto};document.getElementById('reset').onclick=function(){rotY=0;rotX=0;dist=7.2;updateCam()};document.getElementById('labelsBtn').onclick=function(){showLabels=!showLabels;labels.forEach(function(x){x.e.st
