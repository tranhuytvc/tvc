<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TVTECH Anatomy V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040812;color:#fff;font-family:Arial,sans-serif}#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 6%,#17446c 0,#08111e 43%,#02050b 100%)}#view{position:absolute;inset:0 0 250px 0}.hud{position:absolute;z-index:5;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:space-between}.badge,.small{background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:999px;padding:9px 12px;color:#b9f8ff;font-size:11px;font-weight:800;letter-spacing:1px}.small{color:#fff;letter-spacing:0;cursor:pointer}.info{position:absolute;z-index:5;left:12px;right:12px;bottom:262px;padding:12px 14px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.14);border-radius:18px;backdrop-filter:blur(12px)}h1{font-size:22px;margin:0 0 5px}.info p{font-size:13px;color:rgba(255,255,255,.78);line-height:1.35;margin:0}.controls{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(180deg,rgba(8,16,32,.9),rgba(2,5,12,.98));border-top:1px solid rgba(255,255,255,.14);padding:13px;overflow:auto}.title{font-size:12px;color:#86f0ff;text-transform:uppercase;letter-spacing:1.2px;font-weight:900;margin-bottom:8px}.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:7px}.btn{flex:0 0 auto;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.075);color:#fff;padding:11px 13px;font-size:13px;font-weight:800;white-space:nowrap}.btn.active{background:linear-gradient(90deg,rgba(0,213,255,.58),rgba(150,88,255,.48));border-color:#7df1ff}.card{margin-top:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:18px;padding:12px}.sub{color:#8df3ff;font-weight:900;margin-bottom:6px}.txt{font-size:13px;line-height:1.45;color:rgba(255,255,255,.78)}.label{position:absolute;z-index:4;transform:translate(-50%,-50%);padding:5px 8px;border-radius:10px;background:rgba(0,0,0,.46);border:1px solid rgba(126,239,255,.35);color:#e9fdff;font-size:11px;pointer-events:none;white-space:nowrap}.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;padding:8px 12px;background:rgba(0,0,0,.32);border-radius:99px;color:rgba(255,255,255,.7);font-size:12px;white-space:nowrap}@media(min-width:980px){#view{inset:0 360px 0 320px}.controls{top:0;right:auto;width:320px;height:100%;border-top:0;border-right:1px solid rgba(255,255,255,.14)}.row{display:block;overflow:visible}.btn{display:block;width:100%;margin:7px 0;text-align:left}.info{left:auto;right:16px;top:80px;bottom:auto;width:330px}.hint{bottom:22px}}</style></head><body><div id="app"><main id="view"><div class="hud"><div class="badge">TVTECH ANATOMY V3</div><button class="small" id="reset">Reset</button></div><div class="hint">Kéo xoay 360° • Zoom • Chạm vào cơ quan</div></main><section class="info"><h1 id="name">Model cơ thể người V3</h1><p id="topText">Model 3D demo được dựng trực tiếp trong web: da, cơ, xương, mạch máu, thần kinh và nội tạng.</p></section><section class="controls"><div class="title">Chọn chế độ hiển thị</div><div class="row"><button class="btn active" data-stage="0">Full Body</button><button class="btn" data-stage="1">Tách da</button><button class="btn" data-stage="2">Cơ + Xương</button><button class="btn" data-stage="3">X-Ray</button><button class="btn" data-stage="4">Nội tạng</button><button class="btn" data-stage="5">Explode Pro</button></div><div class="card"><div class="sub" id="sub">Tổng quan</div><div class="txt" id="text">Đây là model demo V3, ưu tiên trình diễn tương tác rõ trên iPhone và web demo.</div></div><div class="row" style="margin-top:10px"><button class="btn" id="rotate">Tự xoay</button><button class="btn" id="labels">Nhãn 3D</button><button class="btn" id="pulse">Hiệu ứng tim</button></div></section></div><script type="module">import*as THREE from'https://unpkg.com/three@0.160.0/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';let view=document.getElementById('view'),scene=new THREE.Scene();scene.fog=new THREE.Fog(0x050812,8,23);let cam=new THREE.PerspectiveCamera(42,view.clientWidth/view.clientHeight,.1,100);cam.position.set(0,2.25,7.2);let ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setSize(view.clientWidth,view.clientHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(ren.domElement);let ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.target.set(0,1.85,0);ctl.autoRotate=true;ctl.autoRotateSpeed=.48;scene.add(new THREE.HemisphereLight(0xe6fbff,0x10162a,2.7));let a=new THREE.DirectionalLight(0xffffff,3.2);a.position.set(4,7,6);scene.add(a);let b=new THREE.DirectionalLight(0x6eeaff,2.2);b.position.set(-5,4,-4);scene.add(b);let p=new THREE.PointLight(0x7b61ff,80,11);p.position.set(0,2.8,3.5);scene.add(p);let grid=new THREE.GridHelper(7,38,0x23708a,0x132538);grid.position.y=-.35;scene.add(grid);const mat={skin:new THREE.MeshPhysicalMaterial({color:0xf1b39b,roughness:.4,transparent:true,opacity:.96,transmission:.05}),muscle:new THREE.MeshStandardMaterial({color:0xb3132d,roughness:.42,transparent:true,opacity:.95}),bone:new THREE.MeshStandardMaterial({color:0xeee3ca,roughness:.74,transparent:true,opacity:.96}),blood:new THREE.MeshStandardMaterial({color:0x10d8ff,emissive:0x007aaf,emissiveIntensity:.65,transparent:true,opacity:.95}),nerve:new THREE.MeshStandardMaterial({color:0xffd94f,emissive:0x8c5900,emissiveIntensity:.55,transparent:true,opacity:.92}),heart:new THREE.MeshStandardMaterial({color:0xe21f3a,emissive:0x5d000c,emissiveIntensity:.35}),lung:new THREE.MeshPhysicalMaterial({color:0xf59daa,roughness:.38,transparent:true,opacity:.86}),brain:new THREE.MeshStandardMaterial({color:0xf6bac8,roughness:.45}),liver:new THREE.MeshStandardMaterial({color:0x7d2738,roughness:.5}),stomach:new THREE.MeshStandardMaterial({color:0xf1b367,roughness:.48}),hi:new THREE.MeshStandardMaterial({color:0xffff63,emissive:0xffd000,emissiveIntensity:.9})};const G={skin:new THREE.Group(),muscle:new THREE.Group(),bone:new THREE.Group(),blood:new THREE.Group(),nerve:new THREE.Group(),organ:new THREE.Group()};Object.values(G).forEach(g=>scene.add(g));let click=[],labels=[],heartObj=null,pulse=true;function mesh(n,g,geo,m,pos,s=[1,1,1],rot=[0,0,0]){let o=new THREE.Mesh(geo,m);o.name=n;o.position.set(...pos);o.scale.set(...s);o.rotation.set(...rot);g.add(o);click.push(o);return o}function sph(n,g,m,pos,s){return mesh(n,g,new THREE.SphereGeometry(1,48,32),m,pos,s)}function cap(n,g,r,h,m,pos,s=[1,1,1],rot=[0,0,0]){return mesh(n,g,new THREE.CapsuleGeometry(r,h,14,32),m,pos,s,rot)}function tor(n,g,m,pos,s){return mesh(n,g,new THREE.TorusGeometry(.42,.018,10,72),m,pos,s,[Math.PI/2,0,0])}sph('Đầu',G.skin,mat.skin,[0,3.55,0],[.48,.55,.43]);cap('Thân da',G.skin,.58,1.75,mat.skin,[0,2.22,0],[1.03,1,.67]);for(let s of[-1,1]){cap('Tay da',G.skin,.14,1.65,mat.skin,[s*.84,2.2,0],[1,1,.88],[0,0,s*.22]);cap('Chân da',G.skin,.18,1.85,mat.skin,[s*.29,.72,0],[1,1,.9])}cap('Cơ ngực bụng',G.muscle,.46,1.38,mat.muscle,[0,2.22,.02],[1.04,1,.56]);for(let s of[-1,1]){cap('Cơ tay',G.muscle,.105,1.48,mat.muscle,[s*.72,2.13,.03],[1,1,.84],[0,0,s*.22]);cap('Cơ chân',G.muscle,.13,1.6,mat.muscle,[s*.24,.77,.03],[1,1,.86])}sph('Hộp sọ',G.bone,mat.bone,[0,3.55,0],[.33,.38,.31]);cap('Cột sống',G.bone,.055,1.78,mat.bone,[0,2.14,-.03]);[2.66,2.47,2.28,2.09].forEach(y=>tor('Xương sườn',G.bone,mat.bone,[0,y,.04],[1,.48,.22]));mesh('Xương chậu',G.bone,new THREE.TorusGeometry(.38,.03,12,72),mat.bone,[0,1.34,.02],[1,.52,.25],[Math.PI/2,0,0]);for(let s of[-1,1]){cap('Xương tay',G.bone,.04,1.48,mat.bone,[s*.68,2.12,-.02],[1,1,1],[0,0,s*.22]);cap('Xương chân',G.bone,.05,1.7,mat.bone,[s*.24,.7,-.02])}sph('Não',G.organ,mat.brain,[0,3.58,.08],[.29,.22,.24]);heartObj=sph('Tim',G.organ,mat.heart,[-.17,2.46,.42],[.17,.2,.16]);sph('Phổi trái',G.organ,mat.lung,[-.3,2.43,.35],[.22,.38,.14]);sph('Phổi phải',G.organ,mat.lung,[.3,2.43,.35],[.22,.38,.14]);sph('Gan',G.organ,mat.liver,[.2,1.86,.36],[.36,.15,.18]);sph('Dạ dày',G.organ,mat.stomach,[-.2,1.75,.4],[.17,.25,.15]);for(let i=-3;i<=3;i++)cap('Mạch máu',G.blood,.014,1.45,mat.blood,[i*.11,2.18,.45]);cap('Động mạch chủ',G.blood,.028,2.12,mat.blood,[.1,2.15,.4]);for(let i=-2;i<=2;i++)cap('Dây thần kinh',G.nerve,.01,1.45,mat.nerve,[i*.08,2.12,-.22]);function label(n){let o=click.find(x=>x.name==n);if(!o)return;let e=document.createElement('div');e.className='label';e.textContent=n;view.appendChild(e);labels.push({e,o})}['Tim','Phổi trái','Não','Gan','Dạ dày','Cột sống'].forEach(label);const data={Tim:['Tim','Hệ tuần hoàn','Tim co bóp để bơm máu đi khắp cơ thể.'],Não:['Não','Hệ thần kinh','Não điều khiển vận động, cảm giác, trí nhớ và tư duy.'],'Phổi trái':['Phổi','Hệ hô hấp','Phổi trao đổi khí oxy và CO₂.'],'Phổi phải':['Phổi','Hệ hô hấp','Phổi trao đổi khí oxy và CO₂.'],Gan:['Gan','Chuyển hoá','Gan lọc độc tố, chuyển hoá và hỗ trợ tiêu hoá.'],'Dạ dày':['Dạ dày','Tiêu hoá','Dạ dày chứa, nghiền và tiêu hoá thức ăn.'],'Cột sống':['Cột sống','Xương khớp','Cột sống nâng đỡ cơ thể và bảo vệ tủy sống.']};function info(a,b,c){name.textContent=a;sub.textContent=b;text.textContent=c;topText.textContent=c}let ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),last;view.addEventListener('click',e=>{let r=ren.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,cam);let h=ray.intersectObjects(click,false)[0];if(!h)return;if(last&&last.userData.m)last.material=last.userData.m;last=h.object;last.userData.m=last.material;last.material=mat.hi;let v=data[last.name]||[last.name,'Cấu trúc 3D','Đây là bộ phận trong model demo V3.'];info(...v)});function setG(g,o){g.visible=o>.02;g.traverse(x=>{if(x.material){x.material.transparent=true;x.material.opacity=o}})}function stage(n){let C=[{s:.96,m:0,b:0,v:0,ne:0,o:0,e:0},{s:.18,m:.9,b:.45,v:.25,ne:0,o:.35,e:.7},{s:.04,m:.95,b:1,v:.28,ne:.25,o:.45,e:.35},{s:.08,m:.12,b:1,v:1,ne:.9,o:.75,e:.08},{s:0,m:0,b:.18,v:.25,ne:.15,o:1,e:0},{s:.12,m:.75,b:1,v:1,ne:1,o:1,e:1.25}][n];setG(G.skin,C.s);setG(G.muscle,C.m);setG(G.bone,C.b);setG(G.blood,C.v);setG(G.nerve,C.ne);setG(G.organ,C.o);G.skin.position.x=-C.e;G.muscle.position.x=C.e*.36;G.bone.position.x=C.e*.12;G.blood.position.z=C.e*.32;G.nerve.position.x=C.e*.2;G.organ.position.z=C.e*.18;let T=[['Model cơ thể người V3','Tổng quan','Model 3D demo được dựng trực tiếp trong web, có thể xoay và tương tác.'],['Tách lớp da','Da - cơ - xương','Lớp da được làm mờ và tách sang bên để lộ cấu trúc phía dưới.'],['Cơ + Xương','Hệ vận động','Hiển thị cơ bám quanh xương, mô phỏng hệ vận động của cơ thể.'],['X-Ray','Xương - mạch - thần kinh','Chế độ mô phỏng X-Ray làm nổi bật xương, mạch máu và thần kinh.'],['Nội tạng','Bài học cơ quan','Tập trung vào não, tim, phổi, gan và dạ dày.'],['Explode Pro','Tách lớp trình diễn','Các hệ được tách ra để trình diễn trong bài giảng 3D.']][n];info(...T)}stage(0);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-stage]').forEach(x=>x.classList.remove('active'));b.classList.add('active');stage(+b.dataset.stage)});rotate.onclick=()=>ctl.autoRotate=!ctl.autoRotate;reset.onclick=()=>{cam.position.set(0,2.25,7.2);ctl.target.set(0,1.85,0);ctl.update()};labels.onclick=()=>{show=!show;L.forEach(x=>x.e.style.display=show?'block':'none')};pulse.onclick=()=>pulse=!pulse;let show=true,L=labels;function upd(){L.forEach(({e,o})=>{let q=o.getWorldPosition(new THREE.Vector3()).project(cam);e.style.left=(q.x*.5+.5)*view.clientWidth+'px';e.style.top=(-q.y*.5+.5)*view.clientHeight+'px';e.style.opacity=q.z<1?1:0})}function resize(){cam.aspect=view.clientWidth/view.clientHeight;cam.updateProjectionMatrix();ren.setSize(view.clientWidth,view.clientHeight)}addEventListener('resize',resize);let t=0;function loop(){t+=.016;if(pulse&&heartObj){let k=1+Math.sin(t*6)*.08;heartObj.scale.set(.17*k,.2*k,.16*k)}ctl.update();upd();ren.render(scene,cam);requestAnimationFrame(loop)}loop();</script></body></html>
